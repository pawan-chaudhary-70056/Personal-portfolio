# Production reverse proxy for the single-origin deployment.
#
# - Serves the built SPA from /usr/share/nginx/html.
# - Proxies /api to the API container (service name `api` in
#   docker-compose.prod.yml).
# - Terminates HTTP here; put TLS in front of this container (or add a 443
#   server block) and keep the forwarded protocol header intact.
#
# This file is installed as /etc/nginx/conf.d/default.conf by frontend/Dockerfile.

map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  http    http;
  https   https;
}

upstream portfolio_api {
  server api:4000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;

  # Uploads are capped by the API (MEDIA_MAX_BYTES, 8 MiB by default); allow a
  # small multipart overhead so the API can return its own 413 message.
  client_max_body_size 9m;

  # NOTE: a location that declares its own add_header stops inheriting these,
  # so every location below repeats the block.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed build assets never change for a given filename.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  }

  # The HTML shell must be revalidated so deployments are picked up.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  }

  location /api/ {
    proxy_pass http://portfolio_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite rather than append so a client cannot spoof its address. If a
    # trusted load balancer sits in front of this proxy, forward its real-client
    # header instead.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Client-side routes fall back to the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
